apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting-app-vote
  labels:
    app.kubernetes.io/name: voting-app
    app.kubernetes.io/instance: voting-app
    app.kubernetes.io/component: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: voting-app
      app.kubernetes.io/instance: voting-app
      app.kubernetes.io/component: vote
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voting-app
        app.kubernetes.io/instance: voting-app
        app.kubernetes.io/component: vote
    spec:
      containers:
        - name: vote
          image: vote:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: voting-app-postgres
                  key: SECRET_KEY
            - name: REDIS_URL
              value: "redis://voting-app-redis:6379/0"
            - name: OPTIONS
              value: '["Cats","Dogs"]'
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
